services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agudlc
      POSTGRES_PASSWORD: finagudlc
      POSTGRES_DB: finagudlc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agudlc -d finagudlc"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agudlc:finagudlc@db:5432/finagudlc
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The other half of the queue: it runs the Reviews the API hands over, and
  # starts the ones nobody asks for, on the 1st of each month. Same image and
  # same database as the backend; only the command differs. What time it is in
  # Buenos Aires is the worker's business, not the container's: see
  # WorkerSettings.timezone.
  worker:
    build:
      context: ./backend
    command: arq app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://agudlc:finagudlc@db:5432/finagudlc
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      # Keep the image's install, which the bind mount above would otherwise hide.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
